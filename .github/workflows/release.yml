name: release

# Push a tag like v0.1.0 (matching `version` in Cargo.toml) to publish a GitHub release with `ork`
# for Linux and Windows.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

  binaries:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: ork-x86_64-linux.tar.gz
          - os: windows-latest
            archive: ork-x86_64-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo test --all-features --locked
      - run: cargo build --release --locked
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.archive }}" -C target/release ork -C "$GITHUB_WORKSPACE" README.md LICENSE
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/ork.exe, README.md, LICENSE -DestinationPath "${{ matrix.archive }}"
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" "${{ matrix.archive }}" --clobber
