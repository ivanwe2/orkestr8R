[package]
name = "orkestr8r"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.99.1"
description = "Frontier plans, local executes: run coding orders on your own models, in git worktrees, checked with real commands."
license = "MIT"
repository = "https://github.com/ivanwe2/orkestr8R"
publish = false
default-run = "ork"

[[bin]]
name = "ork"
path = "src/main.rs"

# The helper program the process tests run (sleep, print, exit, env). Behind a feature so
# `cargo install` never installs it; tests run with `--all-features`.
[[bin]]
name = "ork-testtool"
path = "src/bin/ork-testtool.rs"
required-features = ["testtool"]

[features]
testtool = []

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive"] }
dunce = "1.0.5"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
fastrand = "2.5.0"
globset = "0.4.22"
futures = { version = "0.3.34", default-features = false, features = ["std"] }
process-wrap = { version = "11.0.0", features = ["tokio1"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "process", "time", "fs", "io-util", "sync"] }
tokio-util = "0.7.20"
which = "8.0.6"

[dev-dependencies]
axum = "0.8.9"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
